# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [master, adding-github-actions]
  pull_request:
    branches: [master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  KONG_VERSION: 3.9.0
  # KONG_VERSION: 3.4.3.x
  KONG_LICENSE_DATA: ${{ secrets.KONG_LICENSE_DATA }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Get Pongo
      - name: Get Luarocks & Pongo
        run: |
          sudo apt-get install -y luarocks
          git clone https://github.com/Kong/kong-pongo.git
      
      - name: Patched LuaJIT issue # ref: https://github.com/Kong/kong-pongo/issues/668
        run: |
          sed -i '/luarocks install busted-htest/ s#luarocks install busted-htest#luarocks install busted-htest --only-server https://raw.githubusercontent.com/rocks-moonscript-org/moonrocks-mirror/daab2726276e3282dc347b89a42a5107c3500567#' kong-pongo/assets/Dockerfile
          sed -i '/luarocks install luacov/ s#luarocks install luacov#luarocks install luacov --only-server https://raw.githubusercontent.com/rocks-moonscript-org/moonrocks-mirror/daab2726276e3282dc347b89a42a5107c3500567#' kong-pongo/assets/Dockerfile
          sed -i '/luarocks install kong-plugin-dbless-reload/ s#luarocks install kong-plugin-dbless-reload#luarocks install kong-plugin-dbless-reload --only-server https://raw.githubusercontent.com/rocks-moonscript-org/moonrocks-mirror/daab2726276e3282dc347b89a42a5107c3500567#' kong-pongo/assets/Dockerfile
          
          sed -i 's#luarocks install \$$rock .*#luarocks install \$$rock OPENSSL_DIR=\$$(OPENSSL_DIR) CRYPTO_DIR=\$$(OPENSSL_DIR) --only-server https://raw.githubusercontent.com/rocks-moonscript-org/moonrocks-mirror/daab2726276e3282dc347b89a42a5107c3500567 || exit 1;#' kong-pongo/kong-versions/3.9.0/kong/Makefile

      # Pongo run
      - name: Run Pongo
        run: |
          cd session3/github-actions
          ../../kong-pongo/pongo.sh lint
          ../../kong-pongo/pongo.sh run

      # Build artifact
      - name: Make rock
        run: |
          cd session3/github-actions
          luarocks make --pack-binary-rock

      # Upload Artifact to GitHub
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          path: |
            session3/github-actions/*.rock
